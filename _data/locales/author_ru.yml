name: "Андрей Е. Тархов"
bio: >

  <p>
  Сооснователь и CSO <a href="https://genselect.ai">Generative Selection</a>, где мы разрабатываем общий производительный самоулучшающийся научный интеллект для решения задач терапевтической разработки.
  </p>
  <p>
    Я исследователь долголетия с PhD в теоретической физике. Я работал над разработкой терапий, замедляющих старение и продлевающих здоровую жизнь, в <a href="https://gero.ai">Gero</a>, <a href="https://gladyshevlab.bwh.harvard.edu/">Гарварде</a>, и <a href="https://retro.bio">retro.bio</a>.
  </p>
  <p>
  Моя мечта — понять, почему мы стареем, и использовать это знание, чтобы существенно продлить здоровое долголетие человека.
  </p>
