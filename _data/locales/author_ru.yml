name: "Андрей Е. Тархов"
bio: >
  <p>
    Исследователь долголетия с PhD в теоретической физике, после постдока в Гарварде разрабатываю терапии, замедляющие старение и продлевающие жизнь в <a href="https://retro.bio">retro.bio</a>. Моя мечта — понять, почему мы стареем, и использовать это знание, чтобы существенно продлить здоровое долголетие человека. 
  </p>
